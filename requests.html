<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes requests – NotesVault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css"></head><body>
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<div class="topbar"><button class="btn ghost menu-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button><div class="top-right"><button class="btn ghost" id="themeBtn" aria-label="Toggle theme"><i data-lucide="moon"></i></button></div></div>
<h1>Notes requests</h1>
<p class="muted" style="margin:6px 0 18px">Can't find something? Ask your peers.</p>
<div class="split">
  <form class="card" id="reqForm" novalidate>
    <h2>New request</h2>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div><label>Request title</label><input name="title" data-req><div class="err"></div></div>
      <div><label>Subject</label><select name="subject" data-req></select><div class="err"></div></div>
      <div><label>Semester</label><select name="semester" data-req><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><div class="err"></div></div>
      <div><label>Description</label><textarea name="description" rows="3" data-req></textarea><div class="err"></div></div>
    </div>
    <div class="actions"><button class="btn purple" type="submit"><i data-lucide="send"></i>Submit request</button></div>
  </form>
  <div class="card"><h2>All requests</h2><div id="reqList"></div></div>
</div>

<footer>NotesVault · Demo project · Data is stored only in this browser.</footer>
</main>
<div class="modal" id="modal"><div class="box"><div class="topbar"><h2 id="modalTitle"></h2><button class="btn sm ghost" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<div class="toasts"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/requests.js"></script>
</body></html>
