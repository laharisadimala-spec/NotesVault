<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore Notes – NotesVault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css"></head><body>
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
  <div class="topbar"><button class="btn ghost menu-btn" id="menuBtn"><i data-lucide="menu"></i></button>
    <button class="btn ghost" id="themeBtn"><i data-lucide="moon"></i>Theme</button></div>
  <h1 style="margin-bottom:6px">Explore Notes</h1><p class="muted" style="margin-bottom:18px">Unit-wise notes, PPTs and assignments from your peers.</p>
  <input id="search" placeholder="Search by title or subject…" style="margin-bottom:14px">
  <div class="filters">
    <select id="fBranch"></select><select id="fSemester"></select><select id="fSubject"></select>
    <select id="fUnit"></select><select id="fType"></select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div class="modal" id="modal"><div class="box">
  <div class="topbar"><h2 id="modalTitle"></h2><button class="btn sm ghost" onclick="closeModal()">Close</button></div>
  <div id="modalBody"></div></div></div>
<div class="toasts"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/library.js"></script>
</body></html>
