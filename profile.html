<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My profile – NotesVault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css"></head><body>
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<div class="topbar"><button class="btn ghost menu-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button><div class="top-right"><button class="btn ghost" id="themeBtn" aria-label="Toggle theme"><i data-lucide="moon"></i></button></div></div>
<h1>My profile</h1>
<p class="muted" style="margin:6px 0 18px">Demo profile. No account or password is needed.</p>
<div class="split">
  <form class="card" id="profileForm">
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px"><div class="avatar" id="pAvatar" style="width:56px;height:56px;font-size:1.1rem"></div><div><b id="pName"></b><div class="muted" id="pSub"></div></div></div>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div><label>Display name</label><input name="name" data-req><div class="err"></div></div>
      <div><label>College</label><input name="college" data-req><div class="err"></div></div>
      <div><label>Branch</label><select name="branch"><option>CSE</option><option>ECE</option><option>EEE</option><option>IT</option></select></div>
      <div><label>Semester</label><select name="semester"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
    </div>
    <div class="actions"><button class="btn purple" type="submit">Save profile</button></div>
  </form>
  <div class="card" id="settings">
    <h2>Settings</h2>
    <label>Theme</label>
    <select id="themeSel"><option value="light">Light</option><option value="dark">Dark</option></select>
    <div style="margin:16px 0"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="notifChk" style="width:auto"> Show notifications</label></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <p class="muted" style="margin-bottom:10px">Clears uploads, favourites, requests and profile saved in this browser.</p>
    <button class="btn ghost" id="clearBtn" type="button"><i data-lucide="trash-2"></i>Clear demo data</button>
  </div>
</div>

<footer>NotesVault · Demo project · Data is stored only in this browser.</footer>
</main>
<div class="modal" id="modal"><div class="box"><div class="topbar"><h2 id="modalTitle"></h2><button class="btn sm ghost" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<div class="toasts"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/profile.js"></script>
</body></html>
