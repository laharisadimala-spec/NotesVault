<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel – NotesVault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/extra.css"></head><body>
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
  <div class="topbar"><button class="btn ghost menu-btn" id="menuBtn"><i data-lucide="menu"></i></button>
    <button class="btn ghost" id="themeBtn"><i data-lucide="moon"></i>Theme</button></div>
  <h1>Admin Panel</h1>
  <p class="muted" style="margin:6px 0 16px">⚠ Simulated admin panel for demonstration. This is not a secure administrative system.</p>
  <div class="stats" id="adminStats"></div>
  <div class="card" style="overflow:auto"><h2>Uploads</h2>
    <table><thead><tr><th>Title</th><th>Subject</th><th>Contributor</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="uploadRows"></tbody></table></div>
</main>
<div class="modal" id="modal"><div class="box">
  <div class="topbar"><h2 id="modalTitle"></h2><button class="btn sm ghost" onclick="document.getElementById('modal').classList.remove('open')">Close</button></div>
  <div id="modalBody"></div></div></div>
<div class="toasts"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/admin.js"></script>
</body></html>
